api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

when@test:
    api_platform:
        mapping:
            paths:
                - '%kernel.project_dir%/src/Entity'
                # Test-only resources (see config/packages/doctrine.yaml)
                - '%kernel.project_dir%/tests/Fixtures/Entity'
