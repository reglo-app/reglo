name: CI Data

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  data:
    name: Data service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-service/service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-service/service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # The image deployed on the servers must build
      - name: Docker image
        run: docker build -t reglo-data .
