services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    image: ghcr.io/${GHCR_OWNER}/reglo-api:${IMAGE_TAG}
    container_name: ${ENV_NAME}-api
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM}
      APP_WEB_URL: ${APP_WEB_URL}
      # Score of the diagnostic (US-06): the data service of this environment
      DATA_SERVICE_URL: http://data:8000
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:?Set DATA_SERVICE_TOKEN in .env}
    volumes:
      # Uploaded files (profile photos...): kept across deployments
      - uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/health') ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
      - proxy

  # Service data (score of the diagnostic). Internal network only: never
  # reachable from the proxy nor from outside.
  data:
    image: ghcr.io/${GHCR_OWNER}/reglo-data:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:?Set DATA_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  web:
    image: ghcr.io/${GHCR_OWNER}/reglo-web:${IMAGE_TAG}
    container_name: ${ENV_NAME}-web
    restart: unless-stopped
    environment:
      # Only the Next.js server calls the API: the API container of the same
      # environment (both are on the "proxy" network).
      API_INTERNAL_URL: http://${ENV_NAME}-api
      # Features still on mock data (see .env.example). Empty: the default list
      API_MOCKS: ${API_MOCKS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - proxy

networks:
  internal:
  proxy:
    external: true

volumes:
  db_data:
  uploads:
